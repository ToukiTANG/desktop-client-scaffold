[project]
name = "desktop-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.8.*"

dependencies = [
    "alembic==1.14.1",
    "openpyxl==3.1.5",
    "pywebview==4.2.2",
    "sqlalchemy==2.0.52",
    "tomli>=2.0.1,<3",
    "xlrd==2.0.2",
]

[tool.uv]
python-preference = "only-system"

[tool.ruff]
line-length = 120
target-version = "py38"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true
line-ending = "auto"

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[dependency-groups]
dev = [
    "pyinstaller==6.22.2",
    "ruff>=0.16.3",
]
